[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mindpage"
version = "0.1.0.dev0"
description = "Experimental working-set runtime for LLM parameters, experts, adapters, and context"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "MindPage contributors" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["mindpage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
